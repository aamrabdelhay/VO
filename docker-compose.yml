# Local / self-hosted dependency stack for the platform.
# The control plane (this Next.js app) runs separately with `npm run dev`
# or as a container; the data plane below serves user applications.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  registry:
    image: registry:2
    ports: ["5000:5000"]
    volumes: ["registrydata:/var/lib/registry"]

  traefik:
    image: traefik:v3.1
    command: ["--configFile=/etc/traefik/traefik.yml"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    network_mode: host

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: platform
    volumes: ["grafanadata:/var/lib/grafana"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  registrydata:
  grafanadata:
  letsencrypt:
