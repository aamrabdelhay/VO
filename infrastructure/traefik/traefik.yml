# Static Traefik configuration for the data plane.
# The control plane writes ./dynamic/platform.json on every promotion; Traefik
# watches the directory, so routing changes never require a restart and running
# applications keep serving traffic if the control plane is down.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: ${ACME_EMAIL}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
accessLog: {}
