name: Verify self-practice implementation

on:
  push:
    paths:
      - .github/workflows/self-practice-verify.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-self-practice.mjs
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
      - name: Create implementation branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="self-practice/${GITHUB_SHA::8}"
          git switch -c "$BRANCH"
          git config user.name "vo-bot"
          git config user.email "vo-bot@users.noreply.github.com"
          git add src scripts docs package.json .env.example
          git commit -m "feat: add self-supervised code repair loop"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "feat: self-supervised code repair loop" --body "Implementation branch. tsc, eslint, and build run before opening this PR." || true
