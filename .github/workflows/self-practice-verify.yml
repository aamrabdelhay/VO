name: Verify self-practice implementation

on:
  push:
    paths:
      - .github/workflows/self-practice-verify.yml
      - scripts/apply-self-practice.mjs
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonicalize generated source literals before parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('scripts/apply-self-practice.mjs')
          s = p.read_text()
          def canonicalize(text, prefix, end_marker):
              start = text.index(prefix)
              body_start = start + len(prefix)
              if text[body_start] != '`':
                  return text
              end = text.index(end_marker, body_start + 1)
              body = text[body_start + 1:end]
              return text[:start] + prefix[:-1] + json.dumps(body) + text[end:]
          s = canonicalize(s, 'const ollamaClass = `', '`;\nawait write("src/lib/ai/provider.ts"')
          s = canonicalize(s, 'const selfPractice = `', '`;\nawait write("src/lib/ai/self-practice.ts"')
          p.write_text(s)
          PY
      - run: node --check scripts/apply-self-practice.mjs
      - run: node scripts/apply-self-practice.mjs
      - name: Harden generated sandbox containment and deployment build command
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const gateway = 'src/lib/ai/gateway.ts';
          let s = fs.readFileSync(gateway, 'utf8');
          if (!s.includes('@/lib/ai/workspace-path')) {
            s = s.replace('import { redact } from "@/lib/crypto";', 'import { redact } from "@/lib/crypto";\nimport { resolveWorkspacePath } from "@/lib/ai/workspace-path";');
          }
          const oldBlock = '    const full = path.resolve(this.ctx.workspace, relative);\n    if (!full.startsWith(path.resolve(this.ctx.workspace))) {\n      throw new ToolDenied("Path escapes the isolated workspace");\n    }\n    return full;';
          const newBlock = '    try { return resolveWorkspacePath(this.ctx.workspace, relative); } catch { throw new ToolDenied("Path escapes the isolated workspace"); }';
          if (s.includes(oldBlock)) s = s.replace(oldBlock, newBlock);
          fs.writeFileSync(gateway, s);

          const sp = 'src/lib/ai/self-practice.ts';
          let p = fs.readFileSync(sp, 'utf8');
          p = p.replace('row.deployment.buildCommand ?? row.project.buildCommand', 'row.project.buildCommand');
          p = p.replace('import { and, count, desc, eq, isNotNull, sql } from "drizzle-orm";', 'import { and, desc, eq, isNotNull, sql } from "drizzle-orm";');
          p = p.replace('import { runCommand } from "@/lib/runtime";\n', '');
          fs.writeFileSync(sp, p);
          NODE
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
      - name: Create implementation branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="self-practice/${GITHUB_SHA::8}"
          git switch -c "$BRANCH"
          git config user.name "vo-bot"
          git config user.email "vo-bot@users.noreply.github.com"
          git add src scripts docs package.json .env.example
          git diff --cached --quiet && { echo "No implementation diff was generated"; exit 1; }
          git commit -m "feat: add self-supervised code repair loop"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "feat: self-supervised code repair loop" --body "Implementation branch. tsc, eslint, and build run before opening this PR. Correctness is judged only by execution exit codes; no LLM judge is used."