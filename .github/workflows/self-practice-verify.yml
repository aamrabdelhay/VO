name: Apply and verify self-practice

on:
  push:
    paths:
      - .github/workflows/self-practice-verify.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Implement feature directly in checked-out sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def edit(rel, transform):
              p = root / rel
              s = p.read_text()
              n = transform(s)
              if n == s:
                  raise SystemExit(f'No change produced for {rel}')
              p.write_text(n)

          def insert_before(rel, anchor, text):
              def transform(s):
                  if text.strip() in s:
                      return s
                  i = s.find(anchor)
                  if i < 0:
                      raise SystemExit(f'Anchor not found: {rel}: {anchor}')
                  return s[:i] + text + '\n' + s[i:]
              edit(rel, transform)

          provider_add = r'''class OllamaProvider implements AIProvider {
            readonly name = "ollama";
            async complete(messages: ChatMessage[], opts: ProviderOptions) {
              const base = (opts.baseUrl ?? process.env.OLLAMA_BASE_URL ?? "http://127.0.0.1:11434").replace(/\/$/, "");
              const headers: Record<string, string> = { "content-type": "application/json" };
              if (opts.apiKey) headers.authorization = `Bearer ${opts.apiKey}`;
              const response = await fetch(`${base}/api/chat`, {
                method: "POST",
                headers,
                body: JSON.stringify({
                  model: opts.model,
                  stream: false,
                  messages: messages.map((message) => ({ role: message.role, content: textContent(message.content) })),
                  options: { temperature: opts.temperature, num_predict: opts.maxTokens },
                }),
              });
              if (!response.ok) throw new Error(`Ollama request failed (${response.status}): ${await response.text()}`);
              const data = (await response.json()) as { message?: { content?: string }; prompt_eval_count?: number; eval_count?: number };
              return {
                text: data.message?.content ?? "",
                tokensIn: data.prompt_eval_count ?? 0,
                tokensOut: data.eval_count ?? 0,
                costCents: 0,
                provider: this.name,
                model: opts.model,
              };
            }
          }
          '''
          insert_before('src/lib/ai/provider.ts', 'export function providerFor(name: string): AIProvider {', provider_add)
          def provider_switch(s):
              if 'case "ollama": return new OllamaProvider();' in s: return s
              a='export function providerFor(name: string): AIProvider {\n  switch (name) {'
              b='export function providerFor(name: string): AIProvider {\n  switch (name) {\n    case "ollama": return new OllamaProvider();'
              if a not in s: raise SystemExit('provider switch anchor missing')
              return s.replace(a,b,1)
          edit('src/lib/ai/provider.ts', provider_switch)
          def provider_env(s):
              if 'ollama: "OLLAMA_API_KEY"' not in s:
                  old='const direct: Record<string, string> = {'
                  i=s.find(old)
                  if i<0: raise SystemExit('env map anchor missing')
                  s=s[:i]+s[i:].replace(old, old+' ollama: "OLLAMA_API_KEY",',1)
              if 'provider === "ollama"' not in s:
                  s=s.replace('function defaultModel(provider: string) {', 'function defaultModel(provider: string) { if (provider === "ollama") return process.env.OLLAMA_MODEL ?? "qwen2.5-coder";',1)
              return s
          edit('src/lib/ai/provider.ts', provider_env)

          def queue_edit(s):
              if '| "self-practice"' in s: return s
              a='  | "domain-verify";'
              if a not in s: raise SystemExit('queue JobType anchor missing')
              return s.replace(a,'  | "domain-verify"\n  | "self-practice";',1)
          edit('src/lib/queue.ts', queue_edit)

          schema = r'''export const selfPracticeExamples = pgTable(
            "self_practice_examples",
            {
              id: id(),
              projectId: text("project_id").notNull().references(() => projects.id, { onDelete: "cascade" }),
              source: text("source").notNull(),
              problemDescription: text("problem_description").notNull(),
              diff: text("diff").notNull(),
              validationOutput: text("validation_output").notNull(),
              verified: boolean("verified").notNull().default(false),
              createdAt: createdAt(),
            },
            (t) => [
              index("self_practice_project_idx").on(t.projectId, t.createdAt),
              index("self_practice_verified_idx").on(t.verified, t.createdAt),
            ],
          );
          '''
          insert_before('src/db/schema.ts', 'export const aiToolCalls = pgTable("ai_tool_calls", {', schema)

          self_practice = r'''import fs from "node:fs/promises";
          import path from "node:path";
          import { and, desc, eq, isNotNull, sql } from "drizzle-orm";
          import { db } from "@/db";
          import { aiActions, aiConversations, aiFixAttempts, aiMessages, deployments, projects, selfPracticeExamples } from "@/db/schema";
          import { ToolGateway } from "@/lib/ai/gateway";
          import { providerFor, resolveAIConfig, spentTodayCents } from "@/lib/ai/provider";
          import { projectEnv } from "@/lib/deploy";
          import { fetchCommitTarball } from "@/lib/github";
          import { installationToken } from "@/lib/github-auth";
          import { redact } from "@/lib/crypto";
          import { AI_WORKSPACE_ROOT } from "@/lib/ai/agent";

          const DAILY_LIMIT = Math.max(0, Number(process.env.SELF_PRACTICE_DAILY_LIMIT ?? 3));
          const MAX_CONCURRENT = Math.max(1, Number(process.env.SELF_PRACTICE_MAX_CONCURRENT ?? 1));
          const MAX_OUTPUT = 20000;

          export type SelfPracticeProblem = {
            source: "deployment" | "ai-fix-attempt" | "synthetic";
            projectId: string;
            orgId: string;
            deploymentId: string | null;
            commitSha: string;
            description: string;
            error: string;
            buildCommand: string;
            syntheticMutation?: "typescript-type-error";
          };

          export type PatchResponse = { summary?: string; files: { path: string; content: string }[] };

          function parseJsonBlock(text: string): PatchResponse | null {
            const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
            const candidate = fenced?.[1] ?? text;
            const start = candidate.indexOf("{");
            const end = candidate.lastIndexOf("}");
            if (start < 0 || end <= start) return null;
            try { return JSON.parse(candidate.slice(start, end + 1)) as PatchResponse; } catch { return null; }
          }

          async function actionCounts() {
            const rows = await db.execute<{ attempts: number; running: number; passed: number }>(sql`
              select
                count(*) filter (where created_at > now() - interval '1 day')::int as attempts,
                count(*) filter (where status = 'running')::int as running,
                count(*) filter (where status = 'succeeded' and created_at > now() - interval '1 day')::int as passed
              from ai_actions where kind = 'SELF_PRACTICE'
            `);
            return rows.rows?.[0] ?? { attempts: 0, running: 0, passed: 0 };
          }

          export async function getSelfPracticeStats() {
            const counts = await actionCounts();
            const verified = await db.execute<{ total: number }>(sql`select count(*)::int as total from self_practice_examples where verified = true`);
            const attempts = Number(counts.attempts ?? 0);
            return {
              attemptedToday: attempts,
              passRateToday: attempts ? Math.round((Number(counts.passed ?? 0) / attempts) * 100) : 0,
              verifiedExamplesTotal: Number(verified.rows?.[0]?.total ?? 0),
              running: Number(counts.running ?? 0),
              dailyLimit: DAILY_LIMIT,
              enabled: process.env.SELF_PRACTICE_ENABLED === "1",
              providerMode: process.env.OLLAMA_BASE_URL ? "local Ollama" : "cloud fallback",
            };
          }

          export async function harvestProblems(source: "any" | "real" | "synthetic" = "any"): Promise<SelfPracticeProblem[]> {
            const out: SelfPracticeProblem[] = [];
            const seen = new Set<string>();
            if (source !== "synthetic") {
              const failed = await db.select({ deployment: deployments, project: projects }).from(deployments)
                .innerJoin(projects, eq(projects.id, deployments.projectId))
                .where(eq(deployments.status, "FAILED"))
                .orderBy(desc(deployments.finishedAt), desc(deployments.queuedAt)).limit(20);
              for (const row of failed) {
                if (!row.deployment.commitSha || seen.has(row.deployment.id)) continue;
                seen.add(row.deployment.id);
                out.push({ source: "deployment", projectId: row.project.id, orgId: row.project.orgId, deploymentId: row.deployment.id,
                  commitSha: row.deployment.commitSha, description: `Failed deployment ${row.deployment.id} for ${row.project.name}`,
                  error: row.deployment.errorReason ?? "Deployment failed without a recorded error", buildCommand: row.project.buildCommand ?? "npm run build" });
              }
              const attempts = await db.select({ attempt: aiFixAttempts, deployment: deployments, project: projects }).from(aiFixAttempts)
                .innerJoin(projects, eq(projects.id, aiFixAttempts.projectId)).innerJoin(deployments, eq(deployments.id, aiFixAttempts.deploymentId))
                .where(eq(aiFixAttempts.outcome, "failed")).orderBy(desc(aiFixAttempts.createdAt)).limit(20);
              for (const row of attempts) {
                if (!row.deployment.commitSha || seen.has(row.deployment.id)) continue;
                seen.add(row.deployment.id);
                out.push({ source: "ai-fix-attempt", projectId: row.project.id, orgId: row.project.orgId, deploymentId: row.deployment.id,
                  commitSha: row.deployment.commitSha, description: `Recorded failed AI repair attempt ${row.attempt.id} for ${row.project.name}`,
                  error: row.deployment.errorReason ?? row.attempt.stopReason ?? "Recorded AI repair attempt failed", buildCommand: row.project.buildCommand ?? "npm run build" });
              }
            }
            if (source !== "real" && out.length < 1) {
              const candidates = await db.select({ id: projects.id, orgId: projects.orgId, name: projects.name, repoFullName: projects.repoFullName, lastSuccessfulCommitSha: projects.lastSuccessfulCommitSha, buildCommand: projects.buildCommand })
                .from(projects).where(isNotNull(projects.lastSuccessfulCommitSha)).orderBy(desc(projects.updatedAt)).limit(10);
              const candidate = candidates[0];
              if (candidate?.lastSuccessfulCommitSha) {
                out.push({ source: "synthetic", projectId: candidate.id, orgId: candidate.orgId, deploymentId: null, commitSha: candidate.lastSuccessfulCommitSha,
                  description: `Synthetic deterministic TypeScript failure on known-passing commit ${candidate.lastSuccessfulCommitSha.slice(0, 7)}`,
                  error: "Deterministic type mutation; correct repair is to remove the mutation.", buildCommand: candidate.buildCommand ?? "npm run build", syntheticMutation: "typescript-type-error" });
              }
            }
            return out;
          }

          async function mutateSynthetic(workspace: string) {
            const target = path.join(workspace, "src", "lib", "ai", "agent.ts");
            const original = await fs.readFile(target, "utf8");
            const marker = "\nconst __selfPracticeMutationNever: never = 1;\n";
            await fs.writeFile(target, original + marker, "utf8");
            return { target, original };
          }

          async function generate(problem: SelfPracticeProblem, prompt: string, conversationId: string) {
            let provider = "ollama";
            let model = process.env.OLLAMA_MODEL ?? "qwen2.5-coder";
            let apiKey = process.env.OLLAMA_API_KEY ?? "";
            let baseUrl = process.env.OLLAMA_BASE_URL ?? null;
            let budget = Number.POSITIVE_INFINITY;
            if (!process.env.OLLAMA_BASE_URL) {
              console.warn("Self-practice cloud fallback active: this run is not provider-independent. Configure OLLAMA_BASE_URL for local generation.");
              const config = await resolveAIConfig(problem.orgId);
              if (!config || config.provider === "ollama") throw new Error("No configured cloud provider available for self-practice fallback");
              const spent = await spentTodayCents(problem.orgId);
              if (spent >= config.dailyBudgetCents) throw new Error(`Daily AI budget exhausted: ${spent} >= ${config.dailyBudgetCents}`);
              provider = config.provider; model = config.model; apiKey = config.apiKey; baseUrl = config.baseUrl; budget = config.dailyBudgetCents;
            }
            const result = await providerFor(provider).complete([
              { role: "system", content: "Return strict JSON only: {summary:string,files:[{path:string,content:string}]}. The execution verifier decides correctness; do not act as a judge." },
              { role: "user", content: prompt },
            ], { model, apiKey, baseUrl, temperature: 0.1, maxTokens: 4096 });
            await db.insert(aiMessages).values({ conversationId, role: "user", content: prompt.slice(0, 20000), costCents: 0 });
            await db.insert(aiMessages).values({ conversationId, role: "assistant", content: result.text.slice(0, 20000), tokensIn: result.tokensIn, tokensOut: result.tokensOut, costCents: result.costCents });
            if (provider !== "ollama" && result.costCents < 0 || provider !== "ollama" && result.costCents > budget) throw new Error("Invalid cloud self-practice cost");
            return { result, provider, model };
          }

          export async function runSelfPracticeJob(payload: Record<string, unknown> = {}) {
            if (process.env.SELF_PRACTICE_ENABLED !== "1") return { skipped: true, reason: "SELF_PRACTICE_ENABLED is not 1" };
            const counts = await actionCounts();
            if (Number(counts.running ?? 0) >= MAX_CONCURRENT) return { skipped: true, reason: "concurrency cap reached" };
            if (Number(counts.attempts ?? 0) >= DAILY_LIMIT) return { skipped: true, reason: "daily attempt cap reached" };
            const source = payload.source === "synthetic" ? "synthetic" : payload.source === "real" ? "real" : "any";
            const problem = (await harvestProblems(source))[0];
            if (!problem) return { skipped: true, reason: "no harvested problem" };
            const [action] = await db.insert(aiActions).values({ projectId: problem.projectId, deploymentId: problem.deploymentId, kind: "SELF_PRACTICE", status: "running", createdBy: "system", summary: problem.description }).returning();
            const workspace = path.join(AI_WORKSPACE_ROOT, `self-practice-${action.id}`);
            const secrets = Object.values(await projectEnv(problem.projectId, "PRODUCTION"));
            try {
              const project = (await db.select().from(projects).where(eq(projects.id, problem.projectId)).limit(1))[0];
              if (!project) throw new Error("Project not found");
              const token = await installationToken(problem.orgId);
              await fs.rm(workspace, { recursive: true, force: true });
              await fetchCommitTarball(project.repoFullName, problem.commitSha, workspace, token);
              let mutation: { target: string; original: string } | null = null;
              let syntheticFailureOutput = "";
              const gateway = new ToolGateway({ projectId: project.id, orgId: project.orgId, conversationId: action.id, permission: "DEVELOPER", workspace, deploymentId: problem.deploymentId, secrets });
              if (problem.syntheticMutation) {
                mutation = await mutateSynthetic(workspace);
                const install = await gateway.call("run_install", { command: "npm install" });
                if (!install.ok) throw new Error(`Synthetic baseline install failed: ${install.error}`);
                const build = await gateway.call("run_build", { command: problem.buildCommand });
                syntheticFailureOutput = redact(JSON.stringify(build.result ?? null), secrets);
                if ((build.result as { exitCode?: number } | undefined)?.exitCode === 0) throw new Error("Synthetic mutation did not cause a failing build");
              }
              const conversation = await db.insert(aiConversations).values({ projectId: project.id, deploymentId: problem.deploymentId, permission: "DEVELOPER", title: "Self-practice repair", createdBy: "system" }).returning();
              const conversationId = conversation[0].id;
              const research = await gateway.call("list_files", { path: "src" });
              const evidence = problem.syntheticMutation ? syntheticFailureOutput : problem.error;
              const prompt = [
                `Commit: ${problem.commitSha}`,
                `Problem: ${problem.description}`,
                `Failure evidence: ${redact(evidence.slice(-12000), secrets)}`,
                `Build command: ${problem.buildCommand}`,
                `Source tree: ${JSON.stringify(research.result).slice(0, 6000)}`,
                "Produce the smallest repair as strict JSON. Full content only for changed files.",
              ].join("\n");
              const generated = await generate(problem, prompt, conversationId);
              const patch = parseJsonBlock(generated.result.text);
              if (!patch?.files.length) throw new Error("Model returned no applicable JSON patch");
              const applied = await gateway.call("apply_patch", { files: patch.files });
              if (!applied.ok) throw new Error(applied.error);
              const install = await gateway.call("run_install", { command: "npm install" });
              const tests = project.testCommand ? await gateway.call("run_tests", { command: project.testCommand }) : null;
              const build = await gateway.call("run_build", { command: problem.buildCommand });
              const installCode = (install.result as { exitCode?: number } | undefined)?.exitCode;
              const testCode = tests ? (tests.result as { exitCode?: number } | undefined)?.exitCode : 0;
              const buildCode = (build.result as { exitCode?: number } | undefined)?.exitCode;
              const validationOutput = redact(JSON.stringify({ install: install.result, tests: tests?.result, build: build.result }).slice(0, MAX_OUTPUT), secrets);
              if (installCode !== 0 || testCode !== 0 || buildCode !== 0) throw new Error(`Execution verifier failed: install=${installCode} test=${testCode} build=${buildCode}`);
              const diff = await gateway.call("git_diff", {});
              const [example] = await db.insert(selfPracticeExamples).values({ projectId: project.id, source: problem.source, problemDescription: problem.description, diff: redact(String(diff.result ?? "").slice(0, 200000), secrets), validationOutput, verified: true }).returning();
              await db.update(aiActions).set({ status: "succeeded", provider: generated.provider, model: generated.model, costCents: generated.result.costCents, finishedAt: new Date(), summary: patch.summary ?? problem.description }).where(eq(aiActions.id, action.id));
              return { ok: true, example };
            } catch (error) {
              await db.update(aiActions).set({ status: "failed", finishedAt: new Date(), summary: redact(error instanceof Error ? error.message : String(error), secrets).slice(0, 500) }).where(eq(aiActions.id, action.id));
              throw error;
            } finally {
              await fs.rm(workspace, { recursive: true, force: true }).catch(() => undefined);
            }
          }
          '''
          (root / 'src/lib/ai/self-practice.ts').write_text(self_practice)

          def worker_edit(s):
              if 'runSelfPracticeJob' not in s:
                  s=s.replace('import { diagnoseDeployment, runFixLoop } from "@/lib/ai/agent";', 'import { diagnoseDeployment, runFixLoop } from "@/lib/ai/agent";\nimport { runSelfPracticeJob } from "@/lib/ai/self-practice";',1)
              if '"self-practice": async' not in s:
                  s=s.replace('  "ai-fix": async (payload) => runFixLoop(String(payload.deploymentId), String(payload.actor ?? "system")),', '  "ai-fix": async (payload) => runFixLoop(String(payload.deploymentId), String(payload.actor ?? "system")),\n  "self-practice": async (payload) => runSelfPracticeJob(payload),',1)
              return s
          edit('src/lib/worker.ts', worker_edit)

          def prepare_edit(s):
              if 'CREATE TABLE IF NOT EXISTS self_practice_examples' in s: return s
              anchor='  await client.query(`CREATE INDEX IF NOT EXISTS container_project_idx ON container_instances(project_id, status)`);'
              if anchor not in s: raise SystemExit('prepare db anchor missing')
              sqlblock='''\n  await client.query(`CREATE TABLE IF NOT EXISTS self_practice_examples (id text PRIMARY KEY, project_id text NOT NULL REFERENCES projects(id) ON DELETE CASCADE, source text NOT NULL, problem_description text NOT NULL, diff text NOT NULL, validation_output text NOT NULL, verified boolean NOT NULL DEFAULT false, created_at timestamptz NOT NULL DEFAULT now())`);\n  await client.query(`CREATE INDEX IF NOT EXISTS self_practice_project_idx ON self_practice_examples(project_id, created_at)`);\n  await client.query(`CREATE INDEX IF NOT EXISTS self_practice_verified_idx ON self_practice_examples(verified, created_at)`);'''
              return s.replace(anchor, anchor+sqlblock,1)
          edit('scripts/prepare-vercel-db.mjs', prepare_edit)

          (root / 'scripts/export-training-set.mjs').write_text(r'''import fs from "node:fs";
          import path from "node:path";
          import pg from "pg";
          const output = process.argv[2] ?? path.join(process.cwd(), "self-practice-training.jsonl");
          if (!process.env.DATABASE_URL) throw new Error("DATABASE_URL is required");
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const result = await client.query("select problem_description, diff from self_practice_examples where verified = true order by created_at asc");
            fs.writeFileSync(output, result.rows.map((row) => JSON.stringify({ messages: [
              { role: "system", content: "Repair the supplied software defect with the smallest safe patch." },
              { role: "user", content: row.problem_description },
              { role: "assistant", content: row.diff },
            ] })).join("\n") + (result.rowCount ? "\n" : ""));
            console.log(JSON.stringify({ output, examples: result.rowCount }));
          } finally { await client.end(); }
          ''')

          example = root / 'docs/OPERATIONS.md'
          ops = example.read_text()
          if '## Self-practice verified code-repair loop' not in ops:
              ops += r'''

          ## Self-practice verified code-repair loop

          Self-practice collects real failed deployments and recorded failed AI repair attempts, plus deterministic synthetic compiler mutations. Correctness is judged only by sandbox execution exit codes; there is no LLM-as-judge step and model output is never used as ground truth.

          Enable it with `SELF_PRACTICE_ENABLED=1` and keep `SELF_PRACTICE_DAILY_LIMIT` / `SELF_PRACTICE_MAX_CONCURRENT` bounded. When `OLLAMA_BASE_URL` is configured, attempt generation is local Ollama. Without it, the implementation falls back to the configured cloud provider with an explicit warning, and its measured generation cost is included in the existing AI message spend budget.

          Verified examples do not automatically train a model. Run `node scripts/export-training-set.mjs` periodically, upload the JSONL to the operator-controlled Colab/GPU environment, perform the manual Unsloth/LoRA fine-tuning workflow, and push the resulting model to Ollama. Do not run unattended fine-tuning inside the Vercel-hosted app.
          '''
              example.write_text(ops)

          env = root / '.env.example'
          e = env.read_text()
          if 'SELF_PRACTICE_DAILY_LIMIT' not in e:
              env.write_text(e + '\nSELF_PRACTICE_ENABLED=0\nSELF_PRACTICE_DAILY_LIMIT=3\nSELF_PRACTICE_MAX_CONCURRENT=1\nOLLAMA_BASE_URL=http://127.0.0.1:11434\nOLLAMA_MODEL=qwen2.5-coder\n')

          route = root / 'src/app/api/v1/admin/garvex/self-practice/route.ts'
          route.parent.mkdir(parents=True, exist_ok=True)
          route.write_text(r'''import { NextResponse } from "next/server";
          import { requirePlatformAdmin } from "@/lib/auth";
          import { enqueue } from "@/lib/queue";
          import { getSelfPracticeStats } from "@/lib/ai/self-practice";
          export const dynamic = "force-dynamic";
          export async function GET() { await requirePlatformAdmin(); return NextResponse.json(await getSelfPracticeStats()); }
          export async function POST(request: Request) {
            await requirePlatformAdmin();
            const body = (await request.json().catch(() => ({}))) as { source?: "any" | "real" | "synthetic" };
            const source = body.source === "real" || body.source === "synthetic" ? body.source : "any";
            const job = await enqueue({ type: "self-practice", payload: { source }, maxAttempts: 1, priority: 110 });
            return NextResponse.json({ queued: Boolean(job), jobId: job?.id ?? null, source });
          }
          ''')

          page = root / 'src/app/(app)/admin/garvex/page.tsx'
          ps = page.read_text()
          if 'getSelfPracticeStats' not in ps:
              ps = ps.replace('import { getGarvexProviderStatus } from "@/lib/ai/provider";', 'import { getGarvexProviderStatus } from "@/lib/ai/provider";\nimport { getSelfPracticeStats } from "@/lib/ai/self-practice";',1)
              ps = ps.replace('const [providers, capabilities] = await Promise.all([getGarvexProviderStatus(), getGarvexCapabilityPlans()]);', 'const [providers, capabilities, selfPractice] = await Promise.all([getGarvexProviderStatus(), getGarvexCapabilityPlans(), getSelfPracticeStats()]);',1)
              ps = ps.replace('    <GarvexCapabilityPanel capabilities={capabilities} />', '    <GarvexCapabilityPanel capabilities={capabilities} />\n    <section className="garvex-self-practice-panel" aria-label="Verified code-repair examples"><strong>Verified code-repair examples collected: {selfPractice.verifiedExamplesTotal}</strong><span>Run scripts/export-training-set.mjs and fine-tune periodically to apply them.</span><div><span>Attempts today: {selfPractice.attemptedToday}/{selfPractice.dailyLimit}</span><span>Pass rate: {selfPractice.passRateToday}%</span><span>Generation: {selfPractice.providerMode}</span></div></section>',1)
              page.write_text(ps)

          css = root / 'src/app/garvex-capability-panel.css'
          cs = css.read_text() if css.exists() else ''
          if 'garvex-self-practice-panel' not in cs:
              css.write_text(cs + '\n.garvex-self-practice-panel{margin:24px auto 40px;max-width:1400px;padding:18px 20px;border:1px solid rgba(16,28,44,.12);border-radius:14px;background:#fff;display:flex;flex-direction:column;gap:10px}.garvex-self-practice-panel>div{display:flex;gap:20px;flex-wrap:wrap}.garvex-self-practice-panel span{color:#6b6b6b}\n')

          # Fix the existing workspace containment implementation to use the already-present safe helper.
          gateway = root / 'src/lib/ai/gateway.ts'
          gs = gateway.read_text()
          if '@/lib/ai/workspace-path' not in gs:
              gs = gs.replace('import { redact } from "@/lib/crypto";', 'import { redact } from "@/lib/crypto";\nimport { resolveWorkspacePath } from "@/lib/ai/workspace-path";',1)
          unsafe='''    const full = path.resolve(this.ctx.workspace, relative);
              if (!full.startsWith(path.resolve(this.ctx.workspace))) {
                throw new ToolDenied("Path escapes the isolated workspace");
              }
              return full;'''
          safe='''    try { return resolveWorkspacePath(this.ctx.workspace, relative); }
              catch { throw new ToolDenied("Path escapes the isolated workspace"); }'''
          if unsafe in gs: gs=gs.replace(unsafe,safe,1)
          gateway.write_text(gs)

          # Remove temporary failed transformer/wiring after the real source edits are present.
          for rel in ['scripts/apply-self-practice.mjs']:
              p=root/rel
              if p.exists(): p.unlink()
          print('direct self-practice implementation written')
