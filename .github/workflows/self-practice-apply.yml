name: Apply self-practice implementation

on:
  push:
    paths:
      - scripts/apply-self-practice.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check scripts/apply-self-practice.mjs
      - run: node scripts/apply-self-practice.mjs
      - run: node --check scripts/export-training-set.mjs
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
      - name: Commit verified implementation and remove temporary runner
        run: |
          git config user.name "vo-bot"
          git config user.email "vo-bot@users.noreply.github.com"
          rm -f .github/workflows/self-practice-verify.yml .github/workflows/self-practice-apply.yml scripts/apply-self-practice.mjs
          git add src scripts docs .env.example .github/workflows
          git diff --cached --quiet && { echo "No implementation diff"; exit 1; }
          git commit -m "feat: add self-supervised code repair loop"
          git push origin main
