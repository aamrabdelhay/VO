name: Verify main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply pending feature migrations
        run: |
          if [ -f scripts/apply-garvex-features.mjs ]; then node scripts/apply-garvex-features.mjs; fi
          if [ -f scripts/apply-garvex-request-context.mjs ]; then node scripts/apply-garvex-request-context.mjs; fi
          if [ -f scripts/apply-self-practice.mjs ]; then node --check scripts/apply-self-practice.mjs && node scripts/apply-self-practice.mjs; fi
          rm -f scripts/apply-garvex-features.mjs scripts/apply-garvex-request-context.mjs scripts/feature-memory-web.mjs .vo-feature-memory-web
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint .
      - name: Build
        run: npm run build
      - name: Commit applied feature changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add self-supervised code repair loop"
          git push
